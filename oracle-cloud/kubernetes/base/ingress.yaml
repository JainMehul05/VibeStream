apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: VibeStream-ingress
  namespace: vibestream-production
  labels:
    app.kubernetes.io/name: VibeStream-ingress
    app.kubernetes.io/part-of: VibeStream
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - VibeStream.example.com
        - api.VibeStream.example.com
      secretName: VibeStream-tls
  rules:
    - host: VibeStream.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: VibeStream-frontend
                port:
                  number: 3000
    - host: api.VibeStream.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: VibeStream-backend
                port:
                  number: 8000
