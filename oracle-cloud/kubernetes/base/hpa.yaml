apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: VibeStream-backend-hpa
  namespace: vibestream-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: VibeStream-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: VibeStream-ai-ml-hpa
  namespace: vibestream-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: VibeStream-ai-ml
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: VibeStream-frontend-hpa
  namespace: vibestream-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: VibeStream-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
