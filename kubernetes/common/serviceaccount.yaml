apiVersion: v1
kind: ServiceAccount
metadata:
  name: VibeStream-backend
  namespace: VibeStream
  annotations:
    # If using IRSA on EKS, set the IAM role ARN here. Helm chart wires
    # this from `serviceAccount.annotations` so prefer that path in prod.
    # eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/VibeStream-backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: VibeStream-frontend
  namespace: VibeStream
automountServiceAccountToken: false
